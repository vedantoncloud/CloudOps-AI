name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Build production container image
        run: docker build --tag cloudops-ai:ci .

  mysql-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloudops_test
          MYSQL_USER: cloudops
          MYSQL_PASSWORD: cloudops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CLOUDOPS_MYSQL_TEST_URL: mysql+pymysql://cloudops:cloudops@127.0.0.1:3306/cloudops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Upgrade and downgrade shared schema on MySQL 8.4
        run: python -m pytest backend/tests/test_shared_persistence_migrations_mysql.py backend/tests/test_persistent_audit_idempotency_mysql.py backend/tests/test_persistent_audit_trail_mysql.py backend/tests/test_action_plan_store_mysql.py backend/tests/test_gitops_registry_mysql.py backend/tests/test_atomic_lifecycle_audit_mysql.py backend/tests/test_shared_database_readiness_mysql.py -q
