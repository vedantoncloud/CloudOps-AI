name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Build production container image
        run: docker build --tag cloudops-ai:ci .
      - name: Smoke test production container
        env:
          CLOUDOPS_API_TOKENS: '{"smoke-token":{"subject":"smoke-platform-admin","role":"platform_admin","tenant_id":"smoke-tenant","exp":4102444800}}'
        run: |
          set -euo pipefail
          container_name="cloudops-ai-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container_name" || true; docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

                    docker run -d --name "$container_name" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --pids-limit=128 \
            -p 127.0.0.1::8000 \
            --env "CLOUDOPS_API_TOKENS=${CLOUDOPS_API_TOKENS}" \
            cloudops-ai:ci
          
          test "$(docker inspect --format='{{.Config.User}}' "$container_name")" = "cloudops"
          test "$(docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' "$container_name")" = "true"
          test "$(docker inspect --format='{{json .HostConfig.CapDrop}}' "$container_name")" = "[\"ALL\"]"
          docker inspect --format='{{json .HostConfig.SecurityOpt}}' "$container_name" | grep -q 'no-new-privileges:true'
          test "$(docker inspect --format='{{.HostConfig.PidsLimit}}' "$container_name")" = "128"

          host_port="$(docker port "$container_name" 8000/tcp | awk -F: '{print $NF}')"
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/health" > /tmp/cloudops-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Container health endpoint did not become healthy"
            exit 1
          fi
          grep -q '"status":"healthy"' /tmp/cloudops-health.json

          # Initialize the lazy SQLite idempotency store before checking readiness.
          reconciliation_status="$(curl --silent --show-error --output /tmp/cloudops-reconciliation.json --write-out '%{http_code}' --header "Authorization: Bearer smoke-token" "http://127.0.0.1:${host_port}/autonomy/audit/reconciliation")"
          if [ "$reconciliation_status" != "200" ] || ! jq -e '.read_only == true' /tmp/cloudops-reconciliation.json >/dev/null; then
            cat /tmp/cloudops-reconciliation.json
            echo "SQLite audit idempotency store did not initialize successfully"
            exit 1
          fi

          # The SQLite-backed container must report every persistent store ready.
          # AWS may be disconnected in CI, so either readiness HTTP status is valid.
          ready_status=""
          for attempt in $(seq 1 20); do
            ready_status="$(curl --silent --show-error --output /tmp/cloudops-sqlite-ready.json --write-out '%{http_code}' "http://127.0.0.1:${host_port}/ready" || true)"
            if [[ "$ready_status" == "200" || "$ready_status" == "503" ]] && jq -e '
              (.detail.dependencies // .dependencies) as $d
              | $d.audit_events == "healthy"
              and $d.audit_idempotency == "healthy"
              and $d.action_plans == "healthy"
              and $d.gitops_changes == "healthy"
            ' /tmp/cloudops-sqlite-ready.json >/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready_status" != "200" && "$ready_status" != "503" ]] || ! jq -e '
            (.detail.dependencies // .dependencies) as $d
            | $d.audit_events == "healthy"
            and $d.audit_idempotency == "healthy"
            and $d.action_plans == "healthy"
            and $d.gitops_changes == "healthy"
          ' /tmp/cloudops-sqlite-ready.json >/dev/null; then
            cat /tmp/cloudops-sqlite-ready.json
            echo "SQLite-backed production container did not report every persistent store ready"
            exit 1
          fi

          docker_healthy=0
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$container_name")" = "healthy" ]; then
              docker_healthy=1
              break
            fi
            sleep 1
          done
          if [ "$docker_healthy" -ne 1 ]; then
            docker inspect --format='{{json .State.Health}}' "$container_name"
            echo "Docker HEALTHCHECK did not report healthy"
            exit 1
          fi

          unauthenticated_status="$(curl --silent --show-error --output /tmp/cloudops-unauthenticated.json --write-out '%{http_code}' "http://127.0.0.1:${host_port}/operations/failures")"
          if [ "$unauthenticated_status" != "401" ]; then
            cat /tmp/cloudops-unauthenticated.json
            echo "Expected unauthenticated request to return 401, got ${unauthenticated_status}"
            exit 1
          fi

          authenticated_status="$(curl --silent --show-error --output /tmp/cloudops-authenticated.json --write-out '%{http_code}' \
            --header "Authorization: Bearer smoke-token" \
            "http://127.0.0.1:${host_port}/operations/failures")"
          if [ "$authenticated_status" != "200" ]; then
            cat /tmp/cloudops-authenticated.json
            echo "Expected authenticated request to return 200, got ${authenticated_status}"
            exit 1
          fi
          grep -q '"scope":"since_process_start"' /tmp/cloudops-authenticated.json

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit pinned runtime and development dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  mysql-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloudops_test
          MYSQL_USER: cloudops
          MYSQL_PASSWORD: cloudops
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CLOUDOPS_MYSQL_TEST_URL: mysql+pymysql://cloudops:cloudops@127.0.0.1:3306/cloudops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Upgrade and downgrade shared schema on MySQL 8.4
        run: python -m pytest backend/tests/test_shared_persistence_migrations_mysql.py backend/tests/test_persistent_audit_idempotency_mysql.py backend/tests/test_persistent_audit_trail_mysql.py backend/tests/test_action_plan_store_mysql.py backend/tests/test_action_plan_api_multiprocess_mysql.py backend/tests/test_gitops_registry_mysql.py backend/tests/test_atomic_lifecycle_audit_mysql.py backend/tests/test_shared_database_readiness_mysql.py backend/tests/test_atomic_idempotent_audit_mysql.py backend/tests/test_legacy_persistence_import_mysql.py backend/tests/test_shared_rate_limit_api_multiprocess_mysql.py -q

      - name: Prepare migrated MySQL schema for production-container smoke test
        env:
          CLOUDOPS_DATABASE_URL: ${{ env.CLOUDOPS_MYSQL_TEST_URL }}
        run: alembic -c backend/alembic.ini upgrade head

      - name: Build production image for MySQL-backed smoke test
        run: docker build --tag cloudops-ai:mysql-ci .

      - name: Smoke test production container against MySQL 8.4
        env:
          CLOUDOPS_DATABASE_URL: ${{ env.CLOUDOPS_MYSQL_TEST_URL }}
          CLOUDOPS_API_TOKENS: '{"smoke-token":{"subject":"mysql-smoke-platform-admin","role":"platform_admin","tenant_id":"mysql-smoke-tenant","exp":4102444800}}'
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          container_name="cloudops-ai-mysql-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container_name" || true; docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

                    docker run -d --name "$container_name" --network host \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --pids-limit=128 \
            --env "CLOUDOPS_DATABASE_URL=${CLOUDOPS_DATABASE_URL}" \
            --env "CLOUDOPS_API_TOKENS=${CLOUDOPS_API_TOKENS}" \
            --env "AWS_EC2_METADATA_DISABLED=${AWS_EC2_METADATA_DISABLED}" \
            cloudops-ai:mysql-ci
          
          test "$(docker inspect --format='{{.Config.User}}' "$container_name")" = "cloudops"
          test "$(docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' "$container_name")" = "true"
          test "$(docker inspect --format='{{json .HostConfig.CapDrop}}' "$container_name")" = "[\"ALL\"]"
          docker inspect --format='{{json .HostConfig.SecurityOpt}}' "$container_name" | grep -q 'no-new-privileges:true'
          test "$(docker inspect --format='{{.HostConfig.PidsLimit}}' "$container_name")" = "128"

          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/cloudops-mysql-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "MySQL-backed production container did not become healthy"
            exit 1
          fi
          grep -q '"status":"healthy"' /tmp/cloudops-mysql-health.json

          # Verify the shared-MySQL audit reconciliation endpoint through the production container.
          reconciliation_status="$(curl --silent --show-error --output /tmp/cloudops-mysql-reconciliation.json --write-out '%{http_code}' \
            --header "Authorization: Bearer smoke-token" \
            http://127.0.0.1:8000/autonomy/audit/reconciliation)"
          if [ "$reconciliation_status" != "200" ] || ! jq -e '.read_only == true and .evidence.read_only == true and .evidence.store == "mysql"' /tmp/cloudops-mysql-reconciliation.json >/dev/null; then
            cat /tmp/cloudops-mysql-reconciliation.json
            echo "MySQL audit reconciliation smoke request did not return a read-only result"
            exit 1
          fi

          docker_healthy=0
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$container_name")" = "healthy" ]; then
              docker_healthy=1
              break
            fi
            sleep 1
          done
          if [ "$docker_healthy" -ne 1 ]; then
            docker inspect --format='{{json .State.Health}}' "$container_name"
            echo "MySQL-backed Docker HEALTHCHECK did not report healthy"
            exit 1
          fi

          persistence_ready=0
          for attempt in $(seq 1 45); do
            ready_status="$(curl --silent --show-error --output /tmp/cloudops-mysql-ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready || true)"
            if [[ "$ready_status" == "200" || "$ready_status" == "503" ]] && jq -e '
              (.detail.dependencies // .dependencies) as $d
              | $d.audit_events == "healthy"
              and $d.audit_idempotency == "healthy"
              and $d.action_plans == "healthy"
              and $d.gitops_changes == "healthy"
            ' /tmp/cloudops-mysql-ready.json >/dev/null; then
              persistence_ready=1
              break
            fi
            sleep 1
          done
          if [ "$persistence_ready" -ne 1 ]; then
            cat /tmp/cloudops-mysql-ready.json
            echo "Production container did not report every shared MySQL store ready"
            exit 1
          fi

          authenticated_status="$(curl --silent --show-error --output /tmp/cloudops-mysql-authenticated.json --write-out '%{http_code}' \
            --header "Authorization: Bearer smoke-token" \
            http://127.0.0.1:8000/operations/failures)"
          if [ "$authenticated_status" != "200" ]; then
            cat /tmp/cloudops-mysql-authenticated.json
            echo "Expected authenticated operations request to return 200, got ${authenticated_status}"
            exit 1
          fi

  ruff-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.17.6
      - name: Collect baseline diagnostics (non-blocking)
        continue-on-error: true
        run: ruff check backend --output-format=github
      - name: Summarize baseline diagnostics (non-blocking)
        continue-on-error: true
        run: ruff check backend --statistics
